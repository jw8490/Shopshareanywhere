<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- SEO -->
  <title>Shop Share Anywhere | The Western Super App</title>
  <meta name="description" content="Shop Share Anywhere – the Western super app for AI-powered deals, Smart Basket, group carts, prediction markets & social shopping. Shop smarter with Grok." />
  <meta name="theme-color" content="#0a0a0a" />
  
  <!-- Open Graph / Social -->
  <meta property="og:title" content="Shop Share Anywhere | The Western Super App" />
  <meta property="og:description" content="Shop Share Anywhere – the Western super app for AI-powered deals, Smart Basket, group carts, prediction markets & social shopping. Shop smarter with Grok." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.shopshareanywhere.com" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Shop Share Anywhere | The Western Super App" />
  <meta name="twitter:description" content="Shop Share Anywhere – the Western super app for AI-powered deals, Smart Basket, group carts, prediction markets & social shopping." />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Full-screen iframe */
    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0a0a;
    }

    /* Loading state */
    #loader {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    /* Safe area for notched phones */
    @supports (padding: max(0px)) {
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    }
  </style>
</head>
<body>
  <!-- Loading overlay -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Loading Shop Share Anywhere…</div>
  </div>

  <!-- The actual app -->
  <iframe 
    id="app-frame"
    src="https://bluaresh.appbuild.io/#~zgv2awnlx3v1awq9d2viyxbwltm4bw83bnvtdgjv"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    loading="eager"
  ></iframe>

  <script>
    const loader = document.getElementById('loader');
    const frame = document.getElementById('app-frame');

    // Hide loader once iframe loads
    frame.addEventListener('load', () => {
      // Small delay so it feels smoother
      setTimeout(() => {
        loader.classList.add('hidden');
      }, 300);
    });

    // Fallback: hide loader after 8 seconds even if load event fails
    setTimeout(() => {
      loader.classList.add('hidden');
    }, 8000);

    // Optional: prevent pull-to-refresh on mobile
    document.body.addEventListener('touchmove', function(e) {
      if (e.target === document.body) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shop Share Anywhere</title>
  <meta name="description" content="Shop Share Anywhere the Western super app for AI-powered deals, Smart Basket, group carts, prediction markets social shopping. Shop smarter with Grok.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <style>
    :root {
      --bg: #0a0a0a;
      --app-max-width: 430px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html {
      height: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
    }

    body {
      height: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* Same mobile shell on every viewport — centered, phone-width cap */
    #container {
      position: relative;
      width: 100%;
      max-width: var(--app-max-width);
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      flex-shrink: 0;
    }

    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
      display: block;
    }

    #loader {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    @supports (padding: max(0px)) {
      #container {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Shop Share Anywhere</div>
    </div>
    <iframe
      id="app-frame"
      src="https://bluaresh.appbuild.io/zgv2awnlx3v1awq9d2viyxbwltm4bw83bnvtdgjv"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; accelerometer; gyroscope"
      allowfullscreen
      loading="eager"
    ></iframe>
  </div>
  <script>
    const loader = document.getElementById("loader");
    const frame = document.getElementById("app-frame");

    function hideLoader() {
      loader.classList.add("hidden");
    }

    frame.addEventListener("load", function () {
      setTimeout(hideLoader, 200);
    });

    setTimeout(hideLoader, 6500);

    document.addEventListener(
      "touchmove",
      function (e) {
        if (e.touches.length > 1) return;
        e.preventDefault();
      },
      { passive: false }
    );

    function setRealHeight() {
      const h = window.innerHeight;
      document.documentElement.style.setProperty("--vh", h * 0.01 + "px");
      document.body.style.height = h + "px";
      const container = document.getElementById("container");
      container.style.height = h + "px";
    }

    setRealHeight();
    window.addEventListener("resize", setRealHeight);
    window.addEventListener("orientationchange", function () {
      setTimeout(setRealHeight, 100);
    });
  </script>
</body>
</html>

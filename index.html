<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>Shop Share Anywhere</title>
  <meta name="description" content="Shop Share Anywhere – the Western super app for AI-powered deals, Smart Basket, group carts, prediction markets & social shopping. Shop smarter with Grok." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph -->
  <meta property="og:title" content="Shop Share Anywhere | The Western Super App" />
  <meta property="og:description" content="Shop Share Anywhere – the Western super app for AI-powered deals, Smart Basket, group carts, prediction markets & social shopping. Shop smarter with Grok." />
  <meta property="og:type" content="website" />

  <style>
    :root {
      --bg: #0a0a0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: fixed;
      inset: 0;
    }

    /* Main container – optimized for 1080×1320 portrait */
    #container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 1080px;
      max-height: 1320px;
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    /* Full-bleed iframe */
    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
      display: block;
    }

    /* Loading overlay */
    #loader {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* Safe area support for notched devices */
    @supports (padding: max(0px)) {
      #container {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }

    /* When viewed on larger screens, center the 1080×1320 frame */
    @media (min-width: 1081px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
      }
      #container {
        width: 1080px;
        height: 1320px;
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 28px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.7);
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- Loading -->
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Shop Share Anywhere</div>
    </div>

    <!-- App -->
    <iframe
      id="app-frame"
      src="https://bluaresh.appbuild.io/#~zgv2awnlx3v1awq9d2viyxbwltm4bw83bnvtdgjv"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; accelerometer; gyroscope"
      allowfullscreen
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const frame  = document.getElementById('app-frame');

    function hideLoader() {
      loader.classList.add('hidden');
    }

    frame.addEventListener('load', () => {
      setTimeout(hideLoader, 250);
    });

    // Safety fallback
    setTimeout(hideLoader, 7000);

    // Prevent bounce / overscroll on iOS
    document.addEventListener('touchmove', function (e) {
      if (e.target === document.documentElement || e.target === document.body) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
